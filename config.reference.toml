# theater-mode reference configuration
#
# Resolution hierarchy: Built-in defaults -> System config -> User config.
# User configuration path: ~/.config/theater-mode/config.toml
# System configuration path: the first theater-mode/config.toml found in XDG_CONFIG_DIRS,
# which defaults to /etc/xdg.
#
# To modify settings live via D-Bus without editing this file directly:
#   theater-mode config set effect.dimming 0.75
#   theater-mode config preview effect.placement behind_windows
#

[effect]
# Where the effect sits: 'over_windows' covers whatever is on the display,
# blocking its light; 'behind_windows' paints on the desktop behind your open
# windows, which stay visible and usable.
# Options: ["behind_windows", "over_windows"]
placement = "over_windows"

# How dark this display becomes: 0.0 leaves it untouched, 0.85 leaves 15%
# brightness, and 1.0 is solid black. With artwork enabled the value sets how
# darkly the artwork is drawn; with artwork off it sets how much of your
# desktop stays visible. Under placement 'behind_windows' it applies only
# behind your open windows, where a lower value usually reads better.
# Range: [min: 0.0, max: 1.0]
dimming = 0.85

# Show active Steam game library hero artwork on secondary displays (true) or
# flat dark color (false).
art = true


[transition]
# Transition fade duration in seconds.
# Range: [min: 0.01, max: 60.0]
duration = 2.0

# Mathematical easing curve for fade transitions: 'sine', 'quad', 'cubic', or
# 'linear'.
# Options: ["cubic", "linear", "quad", "sine"]
curve = "sine"


[daemon]
# Grace period in seconds before restoring displays after all game windows
# close (0 disables delay).
# Range: [min: 0.0, max: 300.0]
revert_delay = 3.0

# Stability delay in seconds before following a game window when it moves to a
# different display.
# Range: [min: 0.0, max: 60.0]
stage_delay = 1.5

# Only activate theater mode when the game window enters true fullscreen.
require_fullscreen = false

# -----------------------------------------------------------------------------
# Per-Output Overrides (Optional)
#
# Overridable keys: placement, dimming, art, duration, curve
#
# Outputs are matched in this order, and the first section that exists wins:
#   1. make:model:serial  - pins one physical panel, even among identical models
#   2. make:model         - every panel of that model, stable across port swaps
#   3. connector          - whatever is plugged into that port (e.g. DP-1)
#
# Run 'theater-mode outputs' to print the exact section headers for your displays.
# -----------------------------------------------------------------------------
#
# [outputs."Dell Inc.:DELL S2721QS:4QCPZY3"]
# dimming = 0.90
#
# [outputs."Dell Inc.:DELL S2721QS"]
# art = false
#
# [outputs.DP-2]
# dimming = 0.50
# duration = 1.0
#
