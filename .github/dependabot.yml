version: 2

# Weekly updates for pinned GitHub Actions workflow dependencies.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "tools"

  # Tracks upstream releases for the vendored jeepney tree.
  # A proposed version bump fails bin/check until bin/vendor-jeepney has been run.
  - package-ecosystem: "pip"
    directory: "/.github/vendor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "core"
