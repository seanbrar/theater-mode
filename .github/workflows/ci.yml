name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native checks and install lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev pkg-config python3-gi python3-pil shellcheck

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Ruff
        run: |
          uv tool install "ruff>=0.16,<0.17"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Build, lint, and test
        run: ./bin/check

      - name: Test source install lifecycle
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          fake="$RUNNER_TEMP/source-install"
          bin="$fake/bin & tools"
          mkdir -p "$fake"

          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$fake" XDG_BIN_HOME="$bin" ./install.sh --no-service

          for file in "$bin/theater-mode" "$bin/theater-moded" "$bin/theater-dimmer" \
                      "$fake/.local/share/theater-mode/lib/theater_mode/__init__.py" \
                      "$fake/.local/share/theater-mode/config.reference.toml" \
                      "$fake/.local/share/kwin/scripts/theater-detect/metadata.json" \
                      "$fake/.config/systemd/user/theater-mode.service"; do
            [ -e "$file" ] || fail "install omitted $file"
          done

          unit="$fake/.config/systemd/user/theater-mode.service"
          [ "$(sed -n 's|^ExecStart=/usr/bin/env -- "\(.*\)"$|\1|p' "$unit")" = \
            "$bin/theater-moded" ] || fail "unit contains the wrong daemon path"
          systemd-analyze verify "$unit"

          [ ! -e "$fake/.local/share/theater-mode/lib/theater_mode/dimmer" ] \
            || fail "dimmer sources leaked into the install"
          [ -z "$(find "$fake/.local/share/theater-mode/lib" -name __pycache__ -print -quit)" ] \
            || fail "bytecode leaked into the install"

          ambient="$RUNNER_TEMP/ambient/theater_mode"
          mkdir -p "$ambient"
          printf '%s\n' '# Deliberately incomplete ambient package.' > "$ambient/__init__.py"
          (cd / && env -i PATH=/usr/bin:/bin HOME="$fake" \
            PYTHONPATH="$RUNNER_TEMP/ambient" "$bin/theater-mode" --help >/dev/null) \
            || fail "installed client preferred an ambient Python package"

          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$fake" XDG_BIN_HOME="$bin" \
              "$fake/.local/share/theater-mode/install.sh" --uninstall --no-service --yes
          [ "$(find "$fake" \( -type f -o -type l \) | wc -l)" -eq 0 ] \
            || fail "uninstall left files behind"

      - name: Test release archive lifecycle
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist"
          fake="$RUNNER_TEMP/release-home"
          ./bin/make-release \
            --dimmer-bin src/theater_mode/dimmer/theater-dimmer --outdir "$out"
          tar xzf "$out"/*.tar.gz -C "$RUNNER_TEMP"
          root=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'theater-mode-v*' -print -quit)
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
            HOME="$fake" "$root/install.sh" --no-service
          test -f "$fake/.local/share/theater-mode/lib/theater_mode/update.py"
          "$fake/.local/bin/theater-dimmer" --version
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
            HOME="$fake" "$fake/.local/share/theater-mode/install.sh" \
              --uninstall --no-service --yes
          [ "$(find "$fake" \( -type f -o -type l \) | wc -l)" -eq 0 ]

      # The path every 'theater-mode update' takes: install.sh --preserve-service replacing
      # an existing install in place. Nothing else in CI exercises it, and a regression here
      # breaks upgrades for everyone already running theater-mode.
      - name: Test the in-place upgrade path
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          fake="$RUNNER_TEMP/upgrade-home"
          root=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'theater-mode-v*' -print -quit)
          run() {
            env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$fake" "$@"
          }

          run "$root/install.sh" --no-service
          # Prove the second run actually replaces files rather than skipping them.
          echo 'stale' > "$fake/.local/bin/theater-dimmer"
          printf 'stale\n' >> "$fake/.local/share/theater-mode/lib/theater_mode/__init__.py"

          run "$root/install.sh" --preserve-service

          run "$fake/.local/bin/theater-dimmer" --version >/dev/null \
            || fail "upgrade left an unusable theater-dimmer"
          grep -q '^stale$' "$fake/.local/share/theater-mode/lib/theater_mode/__init__.py" \
            && fail "upgrade did not replace the installed package"
          for file in "$fake/.local/bin/theater-mode" "$fake/.local/bin/theater-moded" \
                      "$fake/.local/share/theater-mode/install.sh" \
                      "$fake/.config/systemd/user/theater-mode.service"; do
            [ -e "$file" ] || fail "upgrade lost $file"
          done
          systemd-analyze verify "$fake/.config/systemd/user/theater-mode.service"

          run "$fake/.local/share/theater-mode/install.sh" --uninstall --no-service --yes
          [ "$(find "$fake" \( -type f -o -type l \) | wc -l)" -eq 0 ] \
            || fail "uninstall after upgrade left files behind"

      - name: Test --build and --dimmer-bin selection
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          root=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'theater-mode-v*' -print -quit)
          run() {
            env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
              HOME="$1" "${@:2}"
          }

          # --build must compile even though the archive ships a prebuilt helper.
          built="$RUNNER_TEMP/build-home"
          run "$built" "$root/install.sh" --no-service --build
          run "$built" "$built/.local/bin/theater-dimmer" --version >/dev/null \
            || fail "--build produced an unusable helper"

          # --dimmer-bin must install exactly the file it is given.
          given="$RUNNER_TEMP/given-home"
          run "$given" "$root/install.sh" --no-service \
            --dimmer-bin src/theater_mode/dimmer/theater-dimmer
          cmp -s src/theater_mode/dimmer/theater-dimmer \
                 "$given/.local/bin/theater-dimmer" \
            || fail "--dimmer-bin did not install the helper it was given"

          # A helper that cannot execute must be refused before anything is installed.
          bad="$RUNNER_TEMP/bad-helper"
          printf '#!/nonexistent\n' > "$bad"
          chmod +x "$bad"
          if run "$RUNNER_TEMP/bad-home" "$root/install.sh" --no-service \
               --dimmer-bin "$bad" 2>/dev/null; then
            fail "installer accepted a helper that cannot run"
          fi

      - name: Repository remains clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -t . -v
