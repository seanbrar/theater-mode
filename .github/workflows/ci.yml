name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native checks and install lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev pkg-config python3-yaml shellcheck

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Ruff
        run: |
          uv tool install "ruff>=0.16,<0.17"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Build, lint, and test
        run: ./bin/check

      - name: Test source install lifecycle
        run: tools/runner/native-lifecycle.sh source

      - name: Test release archive lifecycle
        run: tools/runner/native-lifecycle.sh release

      - name: Test the in-place upgrade path
        run: tools/runner/native-lifecycle.sh upgrade

      - name: Test helper build and override selection
        run: tools/runner/native-lifecycle.sh helpers

      - name: Repository remains clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
