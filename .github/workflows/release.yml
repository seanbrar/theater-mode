name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate release source
    # The publishing gate changes runner series only through an explicit edit here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev pkg-config python3-gi python3-yaml shellcheck
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Ruff
        run: |
          uv tool install "ruff>=0.16,<0.17"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: ./bin/check

  build:
    name: build release tarball
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This pins the binary's glibc baseline instead of inheriting ubuntu-latest's.
    container: ubuntu:22.04
    # A container job runs its steps under sh unless told otherwise, and these use
    # `set -o pipefail`, which dash rejects on the first line.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc libc6-dev make pkg-config libwayland-dev binutils git ca-certificates tar gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and inspect release artifact
        run: |
          tag=
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          fi
          tools/runner/release-build.sh dist "$tag"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: dist/*
          if-no-files-found: error

  verify:
    name: install with runtime dependencies only
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-gi libwayland-client0 ca-certificates tar gzip

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Verify archive and install lifecycle
        run: bash dist/verify-release dist

  publish:
    name: publish release
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
      # get.sh runs this exact check and halts on failure. Because actions/attest
      # selects its format by default, verifying here catches upstream format changes
      # before release.
      - name: Verify the attestation the installer will check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh attestation verify dist/*.tar.gz \
                 --hostname github.com \
                 --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
              exit 0
            fi
            echo "attestation not verifiable yet (attempt $attempt); retrying"
            sleep 10
          done
          echo "::error::the published attestation does not satisfy the check get.sh runs"
          exit 1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
