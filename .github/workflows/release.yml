name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate release source
    # The publishing gate changes runner series only through an explicit edit here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev pkg-config python3-gi python3-yaml shellcheck
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Ruff
        run: |
          uv tool install "ruff>=0.16,<0.17"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: ./bin/check

  build:
    name: build release tarball
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This pins the binary's glibc baseline instead of inheriting ubuntu-latest's.
    container: ubuntu:22.04
    # A container job runs its steps under sh unless told otherwise, and these use
    # `set -o pipefail`, which dash rejects on the first line.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc libc6-dev make pkg-config libwayland-dev binutils git ca-certificates tar gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record binary baseline
        run: |
          ldd --version | head -1
          pkg-config --modversion wayland-client

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/theater_mode/__init__.py)
          tag_version="${GITHUB_REF_NAME#v}"
          [ "$source_version" = "$tag_version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $source_version"
            exit 1
          }

      - name: Build and inspect helper binaries
        run: |
          make -C src/theater_mode/dimmer
          ./bin/check-abi-floor src/theater_mode/dimmer/theater-dimmer 2.35
          make -C src/theater_mode/art
          ./bin/check-abi-floor src/theater_mode/art/theater-art 2.35 "libc.so.6 libm.so.6"

      - name: Assemble tarball
        run: ./bin/make-release --dimmer-bin src/theater_mode/dimmer/theater-dimmer --art-bin src/theater_mode/art/theater-art --outdir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: dist/*
          if-no-files-found: error

  verify:
    name: install with runtime dependencies only
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-gi libwayland-client0 ca-certificates tar gzip

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Verify archive and install lifecycle
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ./*.sha256)
          mkdir -p rel fakehome
          tar xzf dist/*.tar.gz -C rel
          root=$(find rel -maxdepth 1 -mindepth 1 -type d)

          for tool in cc gcc make pkg-config; do
            ! command -v "$tool"
          done

          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
            HOME="$PWD/fakehome" "$root/install.sh" --no-service
          for file in .local/bin/theater-mode \
                      .local/libexec/theater-mode/theater-moded \
                      .local/libexec/theater-mode/theater-dimmer \
                      .local/libexec/theater-mode/theater-art \
                      .local/share/theater-mode/lib/theater_mode/update.py \
                      .local/share/kwin/scripts/theater-detect/metadata.json \
                      .config/systemd/user/theater-mode.service; do
            [ -e "$PWD/fakehome/$file" ]
          done
          "$PWD/fakehome/.local/libexec/theater-mode/theater-dimmer" --version
          "$PWD/fakehome/.local/libexec/theater-mode/theater-art" --version
          [ -x "$PWD/fakehome/.local/share/theater-mode/install.sh" ]

          rm -rf rel dist
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_BIN_HOME -u XDG_CACHE_HOME \
            HOME="$PWD/fakehome" "$PWD/fakehome/.local/share/theater-mode/install.sh" \
              --uninstall --no-service --yes
          [ "$(find fakehome \( -type f -o -type l \) | wc -l)" -eq 0 ]

  publish:
    name: publish release
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
      # get.sh runs this exact check and halts on failure. Because actions/attest
      # selects its format by default, verifying here catches upstream format changes
      # before release.
      - name: Verify the attestation the installer will check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh attestation verify dist/*.tar.gz \
                 --hostname github.com \
                 --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
              exit 0
            fi
            echo "attestation not verifiable yet (attempt $attempt); retrying"
            sleep 10
          done
          echo "::error::the published attestation does not satisfy the check get.sh runs"
          exit 1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
