[theater-mode-vm]
image=quay.io/toolbx/arch-toolbox:latest
# QEMU and the image tooling for tools/vm/vm.sh. Kept separate from the development
# container in the repository root: this pulls in far more than a contributor needs to
# build and check the project, and only a maintainer running the guest should pay for it.
additional_packages="qemu-base qemu-ui-gtk qemu-hw-display-virtio-gpu qemu-hw-display-virtio-vga libisoburn curl xorg-server-xvfb"
init_hooks="rm -rf /var/cache/pacman/pkg/*"
init=false
nvidia=false
pull=true
root=false
replace=false
start_now=false
