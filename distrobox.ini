[theater-mode-dev]
image=quay.io/toolbx/arch-toolbox:latest
# Complete development environment for atomic distributions and isolated testing.
additional_packages="gcc make pkgconf python python-gobject python-yaml ruff shellcheck wayland binutils nodejs git"
# Do not retain downloads for packages added while the container is assembled.
init_hooks="rm -rf /var/cache/pacman/pkg/*"
init=false
nvidia=false
pull=true
root=false
replace=false
start_now=true
