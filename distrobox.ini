[theater-mode-dev]
image=quay.io/toolbx/arch-toolbox:latest
# Complete development environment for atomic distributions and isolated testing.
additional_packages="gcc make pkgconf python python-yaml shellcheck wayland binutils nodejs git uv"
# Arch's Ruff package can advance beyond the minor version accepted by pyproject.toml.
# init_hooks runs as root. System-wide uv paths make Ruff available to container users.
init_hooks="env UV_TOOL_DIR=/opt/uv UV_TOOL_BIN_DIR=/usr/local/bin uv tool install ruff~=0.16.0; rm -rf /var/cache/pacman/pkg/*"
init=false
nvidia=false
pull=true
root=false
replace=false
start_now=true
